<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../static/css/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="card empty-state">
        <div class="brand" style="justify-content:center;">
          <span class="brand-mark"><i class="fas fa-bus"></i></span>
          <span>Lux Transit</span>
        </div>
        <h1 style="font-size:4rem; margin:18px 0 0;">404</h1>
        <h2>Page Not Found</h2>
        <p class="muted">The page you are looking for does not exist or has been moved.</p>
        <div class="hero-actions" style="justify-content:center;">
          <button class="btn btn-primary" onclick="window.location.href='LandingPage.html'">Go to Home</button>
          <button class="btn btn-outline" onclick="history.back()">Go Back</button>
        </div>
      </section>
    </main>
  </body>
</html>
