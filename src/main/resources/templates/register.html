<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - Lux Transit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-shell wide">
        <div class="auth-head">
          <a class="brand" th:href="@{/}">
            <span class="brand-mark"><i class="fas fa-bus"></i></span>
            <span>Lux Transit</span>
          </a>
          <h1>Create Your Account</h1>
          <p class="muted">Register once, then book rides and manage reservations from your dashboard.</p>
        </div>

        <div class="card">
          <a class="btn btn-ghost" th:href="@{/}">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>


          <!-- REPLACE <form> with Thymeleaf form -->
          <form th:action="@{/register}" th:object="${user}" method="post" class="form-grid">
            <div class="form-row">
              <div class="field-group">
                <label class="small">First Name</label>
                <input th:field="*{firstname}" class="field" required />
                <span th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}" style="color:red;"></span>
              </div>
              <div class="field-group">
                <label class="small">Last Name</label>
                <input th:field="*{lastname}" class="field" required />
              </div>
            </div>
            <div class="field-group">
              <label class="small">Email</label>
              <input th:field="*{email}" type="email" class="field" required />
              <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></span>
            </div>
            <div class="field-group">
              <label class="small">Password</label>
              <input th:field="*{password}" type="password" class="field" required />
            </div>
            <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
          </form>

          <!-- REPLACE href="LandingPage.html" with th:href="@{/}" -->
          <!-- REPLACE href="login.html" with th:href="@{/login}" -->

        </div>
      </section>
    </main>

  </body>
</html>
