<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passenger Dashboard - Lux Transit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../static/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-inner">
        <a class="brand" href="LandingPage.html">
          <span class="brand-mark"><i class="fas fa-bus"></i></span>
          <span>Lux Transit</span>
        </a>
        <div class="nav-actions">
          <span class="small">Amina Ibrahim</span>
          <button class="btn btn-outline" onclick="logout()">Logout</button>
        </div>
      </div>
    </header>

    <main class="container layout-main">
      <div class="page-title">
        <h1>Welcome back, Amina</h1>
        <p>Manage upcoming trips, review ride history, and book your next route.</p>
      </div>

      <div id="message" class="message" style="margin-top:18px;"></div>

      <section class="grid grid-2" style="margin:24px 0;">
        <article class="card clickable" onclick="navigateTo('book-ride.html')">
          <p class="eyebrow"><i class="fas fa-ticket"></i> New booking</p>
          <h3>Book a Ride</h3>
          <p class="muted">Find available trips and reserve your seat.</p>
        </article>
        <article class="card clickable" onclick="showTab('history')">
          <p class="eyebrow"><i class="fas fa-clock-rotate-left"></i> Booking records</p>
          <h3>Ride History</h3>
          <p class="muted">Review completed trips and previous bookings.</p>
        </article>
      </section>

      <div class="tabs">
        <button id="tabUpcoming" class="btn tab is-active" onclick="showTab('upcoming')">Upcoming Rides</button>
        <button id="tabHistory" class="btn tab" onclick="showTab('history')">Ride History</button>
      </div>

      <section id="content"></section>
    </main>

    <script>
      function navigateTo(path) {
        window.location.href = path;
      }

      function logout() {
        window.location.href = 'login.html';
      }

      const msg = new URLSearchParams(window.location.search).get('message');
      if (msg) {
        const el = document.getElementById('message');
        el.textContent = decodeURIComponent(msg);
        el.style.display = 'block';
      }

      const upcoming = [
        { id: 'TR001234', from: 'Lagos', to: 'Abuja', date: '2026-05-20', time: '08:00 AM', seat: 'A12', status: 'confirmed' },
        { id: 'TR001235', from: 'Abuja', to: 'Lagos', date: '2026-05-25', time: '02:00 PM', seat: 'B05', status: 'confirmed' }
      ];

      const history = [
        { id: 'TR001100', from: 'Lagos', to: 'Ibadan', date: '2026-05-10', time: '10:00 AM', status: 'completed' },
        { id: 'TR001050', from: 'Port Harcourt', to: 'Lagos', date: '2026-04-28', time: '09:00 AM', status: 'completed' }
      ];

      function setActiveTab(tab) {
        document.getElementById('tabUpcoming').classList.toggle('is-active', tab === 'upcoming');
        document.getElementById('tabHistory').classList.toggle('is-active', tab === 'history');
      }

      function rideCard(ride, includeSeat) {
        return `
          <article class="card trip-card">
            <div>
              <span class="chip">${ride.status}</span>
              <span class="small" style="margin-left:8px;">Booking ID: ${ride.id}</span>
              <div class="trip-route">
                <div><strong>${ride.from}</strong><div class="small">Departure</div></div>
                <div class="route-line"></div>
                <div><strong>${ride.to}</strong><div class="small">Arrival</div></div>
              </div>
              <div class="muted">${ride.date} at ${ride.time}${includeSeat ? ` - Seat ${ride.seat}` : ''}</div>
            </div>
            <button class="btn btn-outline" onclick="showTab('history')">History</button>
          </article>
        `;
      }

      function showTab(tab) {
        setActiveTab(tab);
        const rides = tab === 'upcoming' ? upcoming : history;
        document.getElementById('content').innerHTML = rides.map((ride) => rideCard(ride, tab === 'upcoming')).join('');
      }

      showTab('upcoming');
    </script>
  </body>
</html>
