<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login - Smartlynk Transit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<main class="auth-page">
    <section class="auth-shell">
        <div class="auth-head">
            <a class="brand" th:href="@{/}">
                <span class="brand-mark"><i class="fas fa-bus"></i></span>
                <span>Smartlynk Transit</span>
                <span class="chip danger">Admin</span>
            </a>
            <h1>Admin Login</h1>
            <p class="muted">Enter your admin credentials to continue.</p>
        </div>

        <div class="card">
            <p th:if="${errorMessage}" th:text="${errorMessage}"
               style="color:red; margin-bottom:16px;"></p>

            <form th:action="@{/login}" method="post">                
                <div class="field-group">
                    <label class="small">Username</label>
                    <input name="username" type="text" class="field"
                           autocomplete="username" required />
                </div>
                <div class="field-group">
                    <label class="small">Password</label>
                    <input name="password" type="password" class="field"
                           autocomplete="current-password" required />
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-right-to-bracket"></i> Login
                </button>
            </form>

            <p class="small" style="text-align:center; margin-top:16px;">
                <a th:href="@{/login}">Back to user login</a>
            </p>
        </div>
    </section>
</main>

</body>
</html>
