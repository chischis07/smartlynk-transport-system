<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Route - Smartlynk Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<header class="topbar">
    <div class="container nav-inner">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="brand-mark"><i class="fas fa-bus"></i></span>
            <span>Smartlynk Admin</span>
            <span class="chip danger">Admin</span>
        </a>
        <div class="nav-actions">
            <a class="btn btn-outline" th:href="@{/admin/routes}">Back to Routes</a>
        </div>
    </div>
</header>

<main class="container layout-main" style="max-width:600px;">

    <div class="page-title">
        <h1>Edit Route</h1>
        <p th:text="${route.origin + ' → ' + route.destination}"></p>
    </div>

    <section class="card">
        <form th:action="@{/admin/routes/edit/{id}(id=${route.routeId})}"
              th:object="${route}" method="post" class="form-grid">

            <div class="field-group">
                <label class="small">Origin City</label>
                <input th:field="*{origin}" class="field" required />
                <span th:if="${#fields.hasErrors('origin')}" th:errors="*{origin}" style="color:red;"></span>
            </div>

            <div class="field-group">
                <label class="small">Destination City</label>
                <input th:field="*{destination}" class="field" required />
                <span th:if="${#fields.hasErrors('destination')}" th:errors="*{destination}" style="color:red;"></span>
            </div>

            <div class="field-group">
                <label class="small">Distance (km)</label>
                <input th:field="*{distance}" type="number" step="0.1" class="field" min="1" required />
                <span th:if="${#fields.hasErrors('distance')}" th:errors="*{distance}" style="color:red;"></span>
            </div>

            <div class="field-group">
                <label class="small">Fare (₦)</label>
                <input th:field="*{price}" type="number" step="0.01" class="field" min="1" required />
                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:red;"></span>
            </div>

            <div style="display:flex; gap:12px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/admin/routes}" class="btn btn-outline">Cancel</a>
            </div>

        </form>
    </section>

</main>
</body>
</html>
