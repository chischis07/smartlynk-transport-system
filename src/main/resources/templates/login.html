<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Lux Transit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-shell">
        <div class="auth-head">
          <a class="brand" th:href="@{/}">
            <span class="brand-mark"><i class="fas fa-bus"></i></span>
            <span>Smartlynk Transit</span>
          </a>
          <h1>Welcome Back</h1>
          <p class="muted">Login to manage trips, bookings, and ride status.</p>
        </div>

        <div class="card">

          <a class="btn btn-ghost" th:href="@{/}">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>

          <div id="message" class="message"></div>

          <!--  New form insertted -->
          <form th:action="@{/login}" method="post" class="form-grid">
            <div class="field-group">
              <label for="email" class="small">Email Address</label>
              <input id="email" name="email" type="email" class="field" required />
            </div>
            <div class="field-group">
              <label for="password" class="small">Password</label>
              <input id="password" name="password" type="password" class="field" required />
            </div>
            <!-- Show error from controller -->
            <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
          </form>

          <a th:href="@{/register}">Register here</a>
          <!--          End of new form -->

        </div>

        <aside class="demo-box">
          <p><strong>Demo Credentials</strong></p>
          <p><strong>Passenger:</strong> johndoe@gmail.com / Password: johndoe123</p>
          <p><strong>Admin:</strong> admin@luxtraffic.ng / admin123</p>
        </aside>
      </section>
    </main>

  </body>
</html>
